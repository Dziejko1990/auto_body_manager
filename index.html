<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Body Manager</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #111827;
  color: white;
}

.app {
  max-width: 720px;
  margin: auto;
  min-height: 100vh;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.header h1 {
  margin: 0;
  font-size: 26px;
}

.badge {
  background: #2563eb;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
}

.card {
  background: #1f2937;
  border: 1px solid #374151;
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 20px;
}

.card h2 {
  margin-top: 0;
  font-size: 22px;
}

label {
  display: block;
  margin: 15px 0 7px;
  color: #d1d5db;
}

input,
textarea {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  border: 1px solid #4b5563;
  background: #111827;
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

button {
  border: none;
  border-radius: 14px;
  padding: 15px 18px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.add-btn {
  width: 100%;
  margin-top: 20px;
  background: #22c55e;
  color: white;
}

.add-btn:active {
  transform: scale(.98);
}

.route-title {
  display: flex;
  align-items: center;
  gap: 10px;
}

.pickup {
  background: #111827;
  border: 1px solid #374151;
  border-radius: 18px;
  padding: 17px;
  margin-top: 14px;
}

.pickup-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.time {
  font-size: 20px;
  font-weight: 800;
}

.company {
  font-size: 18px;
  font-weight: 700;
  margin-top: 8px;
}

.info {
  color: #d1d5db;
  margin-top: 7px;
}

.notes {
  color: #fbbf24;
  margin-top: 8px;
}

.delete-btn {
  background: #374151;
  color: white;
  width: 100%;
  margin-top: 15px;
}

.empty {
  text-align: center;
  color: #9ca3af;
  padding: 20px 0;
}

.footer {
  text-align: center;
  color: #6b7280;
  font-size: 13px;
  padding: 20px 0;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>Auto Body Manager</h1>
    <div class="badge">DRIVER</div>
  </div>

  <div class="card">

    <h2>➕ Nowy odbiór</h2>

    <label for="company">Warsztat / firma</label>
    <input
      id="company"
      type="text"
      placeholder="np. Golden Car Parts"
    >

    <label for="address">Adres / postcode</label>
    <input
      id="address"
      type="text"
      placeholder="np. WA3 3AL"
    >

    <label for="time">Godzina odbioru</label>
    <input
      id="time"
      type="time"
    >

    <label for="notes">Uwagi</label>
    <textarea
      id="notes"
      placeholder="np. 5 bumperów"
    ></textarea>

    <button class="add-btn" onclick="addPickup()">
      Dodaj odbiór
    </button>

  </div>

  <div class="card">

    <div class="route-title">
      <h2>📍 Dzisiejsza trasa</h2>
    </div>

    <div id="route"></div>

  </div>

  <div class="footer">
    Auto Body Manager
  </div>

</div>

<script>

let pickups = JSON.parse(
  localStorage.getItem("autoBodyPickups") || "[]"
);

function save() {
  localStorage.setItem(
    "autoBodyPickups",
    JSON.stringify(pickups)
  );
}

function addPickup() {

  const company =
    document.getElementById("company").value.trim();

  const address =
    document.getElementById("address").value.trim();

  const time =
    document.getElementById("time").value;

  const notes =
    document.getElementById("notes").value.trim();

  if (!company || !address || !time) {
    alert("Wpisz firmę, adres i godzinę odbioru.");
    return;
  }

  const pickup = {
    id: Date.now(),
    company,
    address,
    time,
    notes
  };

  pickups.push(pickup);

  pickups.sort((a, b) =>
    a.time.localeCompare(b.time)
  );

  save();
  render();

  document.getElementById("company").value = "";
  document.getElementById("address").value = "";
  document.getElementById("time").value = "";
  document.getElementById("notes").value = "";
}

function deletePickup(id) {

  pickups = pickups.filter(
    pickup => pickup.id !== id
  );

  save();
  render();
}

function render() {

  const route =
    document.getElementById("route");

  if (pickups.length === 0) {

    route.innerHTML = `
      <div class="empty">
        Brak zaplanowanych odbiorów
      </div>
    `;

    return;
  }

  route.innerHTML = pickups.map(pickup => `

    <div class="pickup">

      <div class="pickup-top">
        <div class="time">
          ${pickup.time}
        </div>
      </div>

      <div class="company">
        📌 ${escapeHtml(pickup.company)}
      </div>

      <div class="info">
        📍 ${escapeHtml(pickup.address)}
      </div>

      ${
        pickup.notes
        ? `<div class="notes">
             📝 ${escapeHtml(pickup.notes)}
           </div>`
        : ""
      }

      <button
        class="delete-btn"
        onclick="deletePickup(${pickup.id})"
      >
        Usuń
      </button>

    </div>

  `).join("");
}

function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

render();

</script>

</body>
</html>
