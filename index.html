<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Auto Body Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:28px 18px 22px;position:sticky;top:0;z-index:5}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:28px;margin:0;font-weight:800}.role{background:#374151;color:#fff;border:0;border-radius:14px;padding:13px 14px;font-size:16px}
main{max-width:900px;margin:auto;padding:18px}.intro{background:#eff6ff;border-radius:20px;padding:18px;color:#29458e;font-size:18px;line-height:1.35;margin-bottom:16px}
.tabs{display:flex;gap:10px;margin-bottom:16px}.tab{flex:1;border:0;border-radius:18px;padding:16px;font-size:18px;font-weight:700;background:#e5e7eb;color:#374151}.tab.active{background:#3563df;color:white}
.card{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 3px 15px #0000000b}.card h2{margin:0 0 12px;font-size:21px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
input,select,textarea{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;background:white}textarea{min-height:80px}
button.primary{border:0;background:#2563eb;color:white;padding:13px 17px;border-radius:12px;font-size:16px;font-weight:700}
button.secondary{border:0;background:#e5e7eb;color:#111827;padding:13px 17px;border-radius:12px;font-size:16px;font-weight:700}
button.danger{border:0;background:#fee2e2;color:#991b1b;padding:11px 14px;border-radius:11px;font-weight:700}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:13px;font-weight:700}
.stop{border-top:1px solid #e5e7eb;padding:14px 0}.stop:first-child{border-top:0}.muted{color:#6b7280}.empty{padding:28px;text-align:center;color:#6b7280}
.hidden{display:none!important}.small{font-size:14px}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:12px;margin:10px 0}.ok{background:#dcfce7;color:#166534;padding:12px;border-radius:12px;margin:10px 0}
</style>
</head>
<body>
<header><div class="top"><h1>🚚 Auto Body Manager</h1><select id="role" class="role"><option value="driver">Kierowca</option><option value="manager">Kierownik</option></select></div></header>
<main>
<div class="intro"><b>Auto Body Manager V3</b> — trasy, odbiory, status „Odebrane”, problemy i nawigacja.</div>
<div id="message"></div>

<section id="driverView">
<div class="tabs"><button class="tab active">🚚 Trasy</button><button class="tab" onclick="showProblems()">⚠️ Problem</button></div>
<div id="driverRoutes"></div>
</section>

<section id="managerView" class="hidden">
<div class="card"><h2>➕ Dodaj warsztat</h2>
<div class="row"><input id="wName" placeholder="Nazwa warsztatu"><input id="wPost" placeholder="Kod pocztowy"></div>
<div class="row"><input id="wCity" placeholder="Miasto"><input id="wAddress" placeholder="Adres"></div>
<input id="wMap" placeholder="Link Google Maps" style="margin-top:10px">
<textarea id="wNotes" placeholder="Uwagi" style="margin-top:10px"></textarea>
<button class="primary" onclick="addWorkshop()" style="margin-top:10px">Dodaj warsztat</button></div>

<div class="card"><h2>👤 Kierowcy</h2><div id="drivers"></div></div>
<div class="card"><h2>🗺️ Warsztaty</h2><div id="workshops"></div></div>

<div class="card"><h2>➕ Nowa trasa</h2>
<div class="row"><input id="rNumber" placeholder="Numer trasy, np. R-001"><input id="rDate" type="date"></div>
<select id="rDriver" style="margin-top:10px"></select>
<button class="primary" onclick="addRoute()" style="margin-top:10px">Utwórz trasę</button></div>

<div class="card"><h2>🚚 Trasy</h2><div id="managerRoutes"></div></div>
</section>
</main>

<script>
const SUPABASE_URL="https://hxckbwegkjqbkmroltog.supabase.co";
const SUPABASE_KEY="sb_publishable_T_WzNIMA94_yez1xaa3-jg_gA5HVSPR";

async function api(table, opts={}) {
  const headers={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:opts.prefer||"return=representation",...(opts.headers||{})};
  const res=await fetch(SUPABASE_URL+"/rest/v1/"+table,{...opts,headers});
  const text=await res.text();
  if(!res.ok) throw new Error(text||res.statusText);
  return text?JSON.parse(text):[];
}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function msg(t,good=false){document.getElementById("message").innerHTML='<div class="'+(good?"ok":"error")+'">'+esc(t)+'</div>';setTimeout(()=>document.getElementById("message").innerHTML="",3500)}

async function load(){
 try{
  const [drivers,workshops,routes,stops]=await Promise.all([
   api("drivers?select=*&active=eq.true&order=name"),
   api("workshops?select=*&order=name"),
   api("routes?select=*&order=route_date.desc,route_number"),
   api("route_stops?select=*&order=stop_number")
  ]);
  window.DB={drivers,workshops,routes,stops};
  renderDriver();renderManager();
 }catch(e){msg("Nie udało się połączyć z bazą: "+e.message)}
}
function renderDriver(){
 const d=DB.drivers[0];
 const routes=d?DB.routes.filter(r=>r.driver_id===d.id):DB.routes;
 const box=document.getElementById("driverRoutes");
 if(!routes.length){box.innerHTML='<div class="card empty">Brak przydzielonych tras.</div>';return}
 box.innerHTML=routes.map(r=>{
  const stops=DB.stops.filter(s=>s.route_id===r.id).sort((a,b)=>a.stop_number-b.stop_number);
  return '<div class="card"><h2>🚚 '+esc(r.route_number)+' <span class="badge">'+esc(r.status||"Nowa")+'</span></h2><div class="muted">'+esc(r.route_date||"")+'</div>'+
   (stops.length?stops.map(s=>{const w=DB.workshops.find(x=>x.id===s.workshop_id)||{};return '<div class="stop"><b>'+s.stop_number+'. '+esc(w.name)+'</b><br><span class="muted">'+esc(w.address)+' '+esc(w.postcode)+'</span><br>'+(w.google_maps_url?'<a href="'+esc(w.google_maps_url)+'" target="_blank">🗺️ Nawiguj</a><br>':"")+
   '<select onchange="setStopStatus(\''+s.id+'\',this.value)" style="margin-top:8px"><option '+(s.status==="planned"?"selected":"")+' value="planned">Do odebrania</option><option '+(s.status==="collected"?"selected":"")+' value="collected">✅ Odebrane</option><option '+(s.status==="problem"?"selected":"")+' value="problem">⚠️ Problem</option></select></div>'}).join(""):'<div class="empty">Brak przystanków na trasie.</div>')+'</div>'
 }).join("");
}
function showProblems(){const bad=DB.stops.filter(s=>s.status==="problem");document.getElementById("driverRoutes").innerHTML='<div class="card"><h2>⚠️ Problemy</h2>'+(bad.length?bad.map(s=>{const w=DB.workshops.find(x=>x.id===s.workshop_id)||{};return '<div class="stop"><b>'+esc(w.name)+'</b><br>'+esc(w.address)+' '+esc(w.postcode)+'</div>'}).join(""):'<div class="empty">Brak zgłoszonych problemów.</div>')+'</div>'}
async function setStopStatus(id,status){try{await api("route_stops?id=eq."+id,{method:"PATCH",body:JSON.stringify({status,collected_at:status==="collected"?new Date().toISOString():null})});msg("Status zapisany.",true);load()}catch(e){msg(e.message)}}

function renderManager(){
 document.getElementById("drivers").innerHTML=DB.drivers.length?DB.drivers.map(d=>'<div class="stop"><b>'+esc(d.name)+'</b> <span class="muted">'+esc(d.vehicle||"")+'</span></div>').join(""):'<div class="empty">Brak kierowców.</div>';
 document.getElementById("workshops").innerHTML=DB.workshops.length?DB.workshops.map(w=>'<div class="stop"><b>'+esc(w.name)+'</b><br>'+esc(w.address)+' '+esc(w.postcode)+' '+esc(w.city)+'</div>').join(""):'<div class="empty">Brak warsztatów.</div>';
 document.getElementById("rDriver").innerHTML=DB.drivers.map(d=>'<option value="'+d.id+'">'+esc(d.name)+'</option>').join("");
 document.getElementById("managerRoutes").innerHTML=DB.routes.length?DB.routes.map(r=>'<div class="stop"><b>'+esc(r.route_number)+'</b> — '+esc(r.route_date)+'<br><span class="muted">Kierowca: '+esc((DB.drivers.find(d=>d.id===r.driver_id)||{}).name||"nieprzypisany")+'</span></div>').join(""):'<div class="empty">Brak tras.</div>';
}
async function addWorkshop(){
 try{await api("workshops",{method:"POST",body:JSON.stringify({name:wName.value,address:wAddress.value,postcode:wPost.value,city:wCity.value,google_maps_url:wMap.value,notes:wNotes.value})});msg("Warsztat dodany.",true);["wName","wAddress","wPost","wCity","wMap","wNotes"].forEach(id=>document.getElementById(id).value="");load()}catch(e){msg(e.message)}
}
async function addRoute(){
 try{await api("routes",{method:"POST",body:JSON.stringify({route_number:rNumber.value,route_date:rDate.value,driver_id:rDriver.value,status:"planned",notes:""})});msg("Trasa utworzona.",true);rNumber.value="";load()}catch(e){msg(e.message)}
}
role.onchange=()=>{driverView.classList.toggle("hidden",role.value!=="driver");managerView.classList.toggle("hidden",role.value!=="manager");load()}
load();
</script>
</body></html>
