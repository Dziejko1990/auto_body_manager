<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Auto Body Manager</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
    header{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:20px;font-weight:800}
    button,select{font:inherit}.mode{background:#374151;color:white;border:0;border-radius:10px;padding:9px 12px}
    main{max-width:900px;margin:auto;padding:16px 16px 90px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000010}
    h2{margin:4px 0 12px;font-size:21px}.muted{color:#6b7280}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e5e7eb;font-size:12px;font-weight:700}
    .ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;background:#e5e7eb;color:#111827}
    .primary{background:#2563eb;color:white}.danger{background:#dc2626;color:white}.success{background:#16a34a;color:white}
    nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5e7eb;display:flex;justify-content:center;z-index:10}
    nav button{flex:1;max-width:180px;border:0;background:white;padding:13px 6px;color:#6b7280;font-size:12px}nav button.active{color:#2563eb;font-weight:800}
    .hidden{display:none}.stat{font-size:28px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:5px 0 10px}
    @media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<header><div class="top"><div class="brand">🚚 Auto Body Manager</div><select id="mode" class="mode"><option value="driver">Kierowca</option><option value="manager">Kierownik</option></select></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const demo={
 route:{name:"Trasa 1 — Manchester",date:"22/08/2026",driver:"Kierowca",vehicle:"Ford Transit Luton"},
 pickups:[
  {id:1,workshop:"Manchester Auto Parts",address:"Manchester, UK",time:"08:30",status:"Do odebrania"},
  {id:2,workshop:"Body Repair Centre",address:"Salford, UK",time:"10:15",status:"Do odebrania"},
  {id:3,workshop:"Auto Repairs",address:"Warrington, UK",time:"13:00",status:"Do odebrania"}
 ],
 routes:[{id:1,name:"Trasa 1 — Manchester",driver:"Kierowca",status:"Aktywna",stops:3},{id:2,name:"Trasa 2 — Liverpool",driver:"—",status:"Do przydzielenia",stops:5}]
};
let mode="driver",tab="home";
const app=document.getElementById("app"), nav=document.getElementById("nav"), modeEl=document.getElementById("mode");
modeEl.onchange=()=>{mode=modeEl.value;tab="home";render()};
function maps(address){window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(address),"_blank")}
function pickupCard(p){
 return `<div class="card"><div class="row"><strong>${p.workshop}</strong><span class="badge ${p.status==="Odebrane"?"ok":""}">${p.status}</span></div>
 <div class="muted" style="margin-top:6px">${p.address} · ${p.time}</div>
 <div class="actions"><button class="btn primary" onclick="maps('${p.address}')">📍 Nawiguj</button>
 <button class="btn success" onclick="setStatus(${p.id},'Odebrane')">✓ Odebrane</button>
 <button class="btn danger" onclick="setStatus(${p.id},'Problem')">⚠ Problem</button></div></div>`;
}
function setStatus(id,status){demo.pickups.find(p=>p.id===id).status=status;render()}
function driverHome(){
 const done=demo.pickups.filter(p=>p.status==="Odebrane").length;
 return `<h2>Moja trasa</h2><div class="card"><div class="row"><div><div class="muted">${demo.route.date}</div><strong>${demo.route.name}</strong><div class="muted">${demo.route.vehicle}</div></div><span class="badge">${done}/${demo.pickups.length}</span></div></div>
 <div class="grid"><div class="card"><div class="stat">${demo.pickups.length}</div><div class="muted">Odbiorów</div></div><div class="card"><div class="stat">${done}</div><div class="muted">Odebrane</div></div></div>
 <h2>Najbliższe odbiory</h2>${demo.pickups.map(pickupCard).join("")}`;
}
function pickups(){return `<h2>Odbiory</h2>${demo.pickups.map(pickupCard).join("")}`}
function managerHome(){
 return `<h2>Panel kierownika</h2><div class="grid"><div class="card"><div class="stat">${demo.routes.length}</div><div class="muted">Tras</div></div><div class="card"><div class="stat">${demo.pickups.length}</div><div class="muted">Odbiorów</div></div><div class="card"><div class="stat">1</div><div class="muted">Aktywna</div></div><div class="card"><div class="stat">0</div><div class="muted">Problemów</div></div></div>
 <h2>Wszystkie trasy</h2>${demo.routes.map(r=>`<div class="card"><div class="row"><strong>${r.name}</strong><span class="badge">${r.status}</span></div><div class="muted">Kierowca: ${r.driver} · ${r.stops} punktów</div><div class="actions"><button class="btn primary" onclick="tab='routes';render()">Zarządzaj trasą</button></div></div>`).join("")}`;
}
function routes(){return `<h2>Trasy</h2>${demo.routes.map(r=>`<div class="card"><div class="row"><strong>${r.name}</strong><span class="badge">${r.status}</span></div><p class="muted">Kierowca: ${r.driver}<br>Punkty odbioru: ${r.stops}</p><div class="actions"><button class="btn primary">✏ Edytuj</button><button class="btn success">+ Dodaj odbiór</button></div></div>`).join("")}`}
function render(){
 let content="";
 if(mode==="manager") content=tab==="routes"?routes():managerHome();
 else content=tab==="pickups"?pickups():driverHome();
 app.innerHTML=content;
 const items=mode==="manager"?[["home","🏠","Panel"],["routes","🛣️","Trasy"]]:[["home","🏠","Start"],["pickups","📦","Odbiory"]];
 nav.innerHTML=items.map(([id,icon,label])=>`<button class="${tab===id?"active":""}" onclick="tab='${id}';render()">${icon}<br>${label}</button>`).join("");
}
render();
</script>
</body>
</html>
