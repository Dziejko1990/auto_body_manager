<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Auto Body Manager</title>
  <style>
:root {
  --bg: #07101d;
  --bg2: #0b1424;
  --panel: #121d2d;
  --panel2: #172437;
  --line: #26364d;
  --text: #f8fafc;
  --muted: #91a0b6;
  --blue: #3b82f6;
  --blue2: #2563eb;
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --shadow: 0 18px 50px rgba(0,0,0,.26);
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #12243c 0, var(--bg) 32rem);
  color: var(--text);
}
button, input, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
a { color: inherit; text-decoration: none; }
.app-shell { width: min(920px, 100%); margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px max(30px, env(safe-area-inset-bottom)); }
.topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; padding: 4px 2px 22px; }
.eyebrow { margin:0 0 6px; letter-spacing:.15em; font-size:11px; font-weight:800; color:#74a8ff; }
h1 { margin:0; font-size:clamp(28px,7vw,42px); line-height:1.05; letter-spacing:-.03em; }
h2 { margin:0; font-size:22px; }
.muted { color:var(--muted); margin:8px 0 0; text-transform:capitalize; font-size:14px; }
.driver-pill { border:1px solid #34527b; background:#102645; border-radius:999px; padding:10px 13px; font-weight:800; white-space:nowrap; cursor:pointer; }
.stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
.stat-card { display:flex; align-items:center; gap:10px; min-width:0; background:rgba(18,29,45,.88); border:1px solid var(--line); border-radius:18px; padding:14px; box-shadow:var(--shadow); }
.stat-icon { font-size:20px; }
.stat-card strong { display:block; font-size:24px; line-height:1; }
.stat-card span:last-child { display:block; color:var(--muted); font-size:12px; margin-top:5px; }
.panel { background:linear-gradient(180deg, rgba(22,35,53,.97), rgba(16,27,43,.97)); border:1px solid var(--line); border-radius:24px; padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
.panel-title { width:100%; display:flex; align-items:center; justify-content:space-between; border:0; background:none; padding:0; color:var(--text); font-size:22px; font-weight:850; cursor:pointer; }
.title-icon { display:inline-grid; place-items:center; width:31px; height:31px; border-radius:10px; background:#163e76; color:#7eb1ff; margin-right:6px; }
form { overflow:hidden; max-height:900px; opacity:1; transition:.25s ease; }
form.collapsed { max-height:0; opacity:0; pointer-events:none; }
.field-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; padding-top:8px; }
.field { display:block; color:#cbd5e1; font-size:13px; font-weight:700; margin-top:14px; }
.field.wide { grid-column:1/-1; }
input, textarea { width:100%; margin-top:7px; padding:14px 14px; border:1px solid #31425a; border-radius:13px; outline:none; color:white; background:#0a1422; transition:border .15s, box-shadow .15s; }
input:focus, textarea:focus { border-color:#4f91f6; box-shadow:0 0 0 3px rgba(59,130,246,.14); }
textarea { min-height:82px; resize:vertical; }
.form-actions { display:flex; gap:10px; margin-top:18px; }
.btn { border:0; border-radius:14px; min-height:48px; padding:12px 16px; font-weight:850; cursor:pointer; }
.btn-primary { flex:1; background:linear-gradient(135deg, #2f80ed, #2563eb); box-shadow:0 10px 24px rgba(37,99,235,.22); }
.btn-ghost { background:#1b2a3e; border:1px solid #32445e; }
.btn-danger { background:#471c25; border:1px solid #7d2d3a; color:#ffb8c1; }
.route-heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.icon-btn { width:42px; height:42px; border-radius:12px; border:1px solid var(--line); background:#17263a; cursor:pointer; }
.filter-row { display:flex; gap:8px; overflow:auto; padding-bottom:4px; margin-bottom:14px; scrollbar-width:none; }
.filter { flex:none; border:1px solid #304158; background:#101a29; color:#aebbd0; padding:9px 12px; border-radius:999px; font-size:13px; font-weight:800; cursor:pointer; }
.filter.active { color:#fff; background:#1f5fbf; border-color:#377edf; }
.route-list { display:grid; gap:12px; }
.pickup-card { position:relative; display:grid; grid-template-columns:38px 1fr; gap:10px; background:#0b1523; border:1px solid #26384f; border-radius:18px; padding:14px; }
.pickup-card.done { opacity:.66; }
.pickup-number { display:grid; place-items:center; align-self:start; width:32px; height:32px; border-radius:10px; background:#19365d; color:#8bb9ff; font-weight:900; }
.pickup-card.done .pickup-number { background:#153d29; color:#72dfa0; }
.pickup-head { display:flex; justify-content:space-between; gap:10px; }
.pickup-time { display:block; color:#78aaff; font-size:18px; font-weight:900; margin-bottom:3px; }
.pickup-head h3 { margin:0; font-size:18px; line-height:1.25; }
.status { flex:none; align-self:start; padding:6px 8px; border-radius:999px; font-size:9px; letter-spacing:.08em; font-weight:900; }
.status.pending { background:#4b3511; color:#ffd27a; }
.status.done { background:#143c28; color:#77e0a3; }
.address { display:inline-block; margin-top:10px; color:#cbd8ea; font-weight:700; }
.pickup-detail, .pickup-note { margin-top:8px; color:#aebbd0; font-size:14px; }
.pickup-note { color:#f4cf7b; }
.pickup-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:13px; }
.action { border:1px solid #2c3d55; background:#142238; border-radius:10px; padding:8px 10px; color:#dbe7f8; font-size:12px; font-weight:800; cursor:pointer; }
.action.nav { background:#173868; border-color:#285b9f; }
.action.complete { background:#15412a; border-color:#287044; color:#9cf2bd; }
.action.delete { color:#ffabb4; }
.empty-state { display:grid; justify-items:center; text-align:center; gap:7px; padding:28px 14px; color:#c6d2e2; }
.empty-state span { color:var(--muted); font-size:13px; }
.empty-icon { font-size:35px; margin-bottom:3px; }
.tools-panel h2 { margin-bottom:12px; }
.tool-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.file-btn { position:relative; display:flex; align-items:center; justify-content:center; text-align:center; }
.file-btn input { position:absolute; inset:0; opacity:0; cursor:pointer; margin:0; }
.tool-grid .btn-danger { grid-column:1/-1; }
.hidden { display:none !important; }
footer { padding:8px 2px 2px; color:#65768d; font-size:12px; text-align:center; }
.toast { position:fixed; left:50%; bottom:max(20px, env(safe-area-inset-bottom)); transform:translate(-50%, 20px); background:#f8fafc; color:#0f172a; padding:11px 15px; border-radius:999px; font-weight:800; font-size:13px; box-shadow:0 12px 35px rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:.2s ease; z-index:50; white-space:nowrap; max-width:calc(100vw - 30px); overflow:hidden; text-overflow:ellipsis; }
.toast.show { opacity:1; transform:translate(-50%, 0); }
@media (max-width:620px) {
  .app-shell { padding-left:12px; padding-right:12px; }
  .topbar { align-items:center; }
  .driver-pill { max-width:130px; overflow:hidden; text-overflow:ellipsis; }
  .stats-grid { gap:7px; }
  .stat-card { padding:11px 9px; gap:7px; border-radius:15px; }
  .stat-icon { font-size:16px; }
  .stat-card strong { font-size:21px; }
  .stat-card span:last-child { font-size:10px; }
  .panel { border-radius:20px; padding:16px; }
  .field-grid { grid-template-columns:1fr; }
  .field.wide { grid-column:auto; }
  .form-actions { flex-direction:column; }
  .pickup-card { grid-template-columns:34px 1fr; padding:12px; }
  .pickup-head { flex-direction:column; }
  .status { align-self:flex-start; }
  .tool-grid { grid-template-columns:1fr; }
  .tool-grid .btn-danger { grid-column:auto; }
}

.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.driver-mode-btn{border:0;background:#2563eb;color:#fff;border-radius:999px;padding:10px 13px;font-weight:900}.route-tools{display:grid;grid-template-columns:1.3fr 1fr;gap:9px;margin-bottom:14px}.btn-map{background:#0f6b46;border:1px solid #16865a;color:#eafff5}.workshop-chips{display:flex;flex-wrap:wrap;gap:8px}.workshop-chip{border:1px solid #304158;background:#101a29;color:#dce8f7;padding:9px 11px;border-radius:999px;font-weight:800}.small{font-size:13px}

body.driver-mode .add-panel,body.driver-mode .workshops-panel,body.driver-mode .tools-panel,body.driver-mode .stats-grid{display:none!important}body.driver-mode .pickup-card{grid-template-columns:42px 1fr;padding:16px}body.driver-mode .pickup-number{width:38px;height:38px}body.driver-mode .pickup-head h3{font-size:21px}body.driver-mode .pickup-time{font-size:22px}body.driver-mode .action{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:11px 13px;font-size:14px}body.driver-mode .action.nav{flex:1 1 130px;background:#1d5fb8}body.driver-mode .action.complete{flex:1 1 110px}body.driver-mode footer{display:none}
@media(max-width:620px){.top-actions{max-width:145px}.driver-pill,.driver-mode-btn{font-size:12px;padding:9px 10px}.route-tools{grid-template-columns:1fr}}

</style>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">AUTO BODY MANAGER</p>
        <h1>Trasa kierowcy</h1>
        <p id="todayLabel" class="muted"></p>
      </div>
      <div class="top-actions"><button class="driver-pill" id="driverBtn" type="button">👤 <span id="driverName">Kierowca</span></button><button class="driver-mode-btn" id="driverModeBtn" type="button">🚚 DRIVER</button></div>
    </header>

    <section class="stats-grid" aria-label="Podsumowanie trasy">
      <article class="stat-card"><span class="stat-icon">📍</span><div><strong id="statAll">0</strong><span>Wszystkie</span></div></article>
      <article class="stat-card"><span class="stat-icon">🚚</span><div><strong id="statActive">0</strong><span>Do zrobienia</span></div></article>
      <article class="stat-card"><span class="stat-icon">✅</span><div><strong id="statDone">0</strong><span>Gotowe</span></div></article>
    </section>

    <main>
      <section class="panel add-panel">
        <button class="panel-title collapsible" id="toggleForm" type="button" aria-expanded="true">
          <span><span class="title-icon">＋</span> Nowy odbiór</span>
          <span id="toggleArrow">⌃</span>
        </button>

        <form id="pickupForm" autocomplete="off">
          <input type="hidden" id="editingId">
          <div class="field-grid">
            <label class="field wide">Warsztat / firma
              <input id="company" type="text" placeholder="np. Golden Car Parts" required>
            </label>
            <label class="field">Adres / postcode
              <input id="address" type="text" placeholder="np. WA3 3AL" required>
            </label>
            <label class="field">Data
              <input id="pickupDate" type="date" aria-label="Data odbioru">
            </label>
            <label class="field">Godzina
              <input id="time" type="time" aria-label="Godzina odbioru">
            </label>
            <label class="field">Telefon
              <input id="phone" type="tel" inputmode="tel" placeholder="np. 07700 900123">
            </label>
            <label class="field">Ilość części
              <input id="quantity" type="number" inputmode="numeric" min="0" step="1" placeholder="np. 5">
            </label>
            <label class="field wide">Co odbierasz?
              <input id="items" type="text" placeholder="np. zderzaki, drzwi, błotnik">
            </label>
            <label class="field wide">Uwagi
              <textarea id="notes" placeholder="np. zapytać o fakturę, odbiór z tylnej bramy"></textarea>
            </label>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" id="saveBtn" type="submit">＋ Dodaj do trasy</button>
            <button class="btn btn-ghost hidden" id="cancelEditBtn" type="button">Anuluj edycję</button>
          </div>
        </form>
      </section>

      <section class="panel route-panel">
        <div class="route-heading">
          <div>
            <p class="eyebrow">DZISIAJ</p>
            <h2>Dzisiejsza trasa</h2>
          </div>
          <button class="icon-btn" id="moreBtn" type="button" aria-label="Opcje">•••</button>
        </div>

        <div class="day-row">
          <button class="day-filter active" data-day="today" type="button">Dzisiaj</button>
          <button class="day-filter" data-day="tomorrow" type="button">Jutro</button>
          <button class="day-filter" data-day="all" type="button">Wszystkie dni</button>
        </div>
        <div class="filter-row">
          <button class="filter active" data-filter="all" type="button">Wszystkie</button>
          <button class="filter" data-filter="pending" type="button">Do odbioru</button>
          <button class="filter" data-filter="done" type="button">Zrobione</button>
        </div>

        <div class="route-tools">
  <button class="btn btn-map" id="openWholeRouteBtn" type="button">🗺️ Otwórz całą trasę</button>
  <button class="btn btn-ghost" id="sortRouteBtn" type="button">↕️ Ułóż wg godziny</button>
  <button class="btn btn-ghost" id="shareRouteBtn" type="button">📤 Udostępnij trasę</button>
  <button class="btn btn-ghost" id="historyBtn" type="button">🧾 Historia</button>
</div>
        <div id="nextStopCard" class="next-stop-card hidden"></div>
        <div id="route" class="route-list"></div>
      </section>

      <section class="panel workshops-panel"><div class="route-heading"><div><p class="eyebrow">SZYBKI DOSTĘP</p><h2>Zapisane warsztaty</h2></div></div><div id="workshops" class="workshop-chips"></div></section>

      <section class="panel history-panel hidden" id="historyPanel">
        <div class="route-heading"><div><p class="eyebrow">ARCHIWUM</p><h2>Historia odbiorów</h2></div></div>
        <div id="historyList" class="route-list"></div>
      </section>

      <section class="panel tools-panel hidden" id="toolsPanel">
        <h2>Narzędzia</h2>
        <div class="tool-grid">
          <button class="btn btn-ghost" id="exportBtn" type="button">⬇️ Eksport danych</button>
          <label class="btn btn-ghost file-btn">⬆️ Import danych<input id="importInput" type="file" accept="application/json"></label>
          <button class="btn btn-danger" id="clearBtn" type="button">🗑️ Wyczyść trasę</button>
        </div>
      </section>
    </main>

    <footer>Auto Body Manager v6 • dane zapisują się na tym urządzeniu</footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = 'autoBodyManagerV3';
    const LEGACY_KEYS = ['autoBodyManagerV2', 'autoBodyPickups', 'pickups'];
    let currentFilter = 'all';
    let currentDay = 'today';
    let pickups = loadPickups();

    const $ = (id) => document.getElementById(id);
    const routeEl = $('route');
    const form = $('pickupForm');

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function normalizePickup(p) {
      return {
        id: String(p.id ?? uid()),
        company: p.company ?? p.garage ?? '',
        address: p.address ?? p.postcode ?? '',
        time: p.time ?? '',
        pickupDate: p.pickupDate ?? new Date().toISOString().slice(0,10),
        phone: p.phone ?? '',
        quantity: p.quantity ?? '',
        items: p.items ?? '',
        notes: p.notes ?? '',
        status: p.status === 'done' ? 'done' : 'pending',
        createdAt: p.createdAt ?? Date.now(),
        completedAt: p.completedAt ?? null
      };
    }

    function loadPickups() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (Array.isArray(saved)) return saved.map(normalizePickup);
        for (const key of LEGACY_KEYS) {
          const legacy = JSON.parse(localStorage.getItem(key) || 'null');
          if (Array.isArray(legacy) && legacy.length) {
            const migrated = legacy.map(normalizePickup);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
            return migrated;
          }
        }
      } catch (_) {}
      return [];
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(pickups));
    }

    function escapeHtml(value = '') {
      const div = document.createElement('div');
      div.textContent = String(value);
      return div.innerHTML;
    }

    function showToast(message) {
      const toast = $('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function updateHeader() {
      $('todayLabel').textContent = new Intl.DateTimeFormat('pl-PL', {
        weekday: 'long', day: 'numeric', month: 'long'
      }).format(new Date());
      const name = localStorage.getItem('driverName') || localStorage.getItem('driver') || '';
      $('driverName').textContent = name || 'Kierowca';
    }

    function updateStats() {
      const done = pickups.filter(p => p.status === 'done').length;
      $('statAll').textContent = pickups.length;
      $('statDone').textContent = done;
      $('statActive').textContent = pickups.length - done;
    }


    function isoDate(d = new Date()) {
      const x = new Date(d);
      x.setMinutes(x.getMinutes() - x.getTimezoneOffset());
      return x.toISOString().slice(0,10);
    }

    function tomorrowIso() {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      return isoDate(d);
    }

    function activeDayDate() {
      if (currentDay === 'today') return isoDate();
      if (currentDay === 'tomorrow') return tomorrowIso();
      return null;
    }

    function filteredPickups() {
      const day = activeDayDate();
      return pickups
        .filter(p => (!day || p.pickupDate === day))
        .filter(p => currentFilter === 'all' || p.status === currentFilter)
        .sort((a, b) => {
          if (a.status !== b.status) return a.status === 'done' ? 1 : -1;
          return (a.time || '99:99').localeCompare(b.time || '99:99');
        });
    }


    function renderWorkshops() {
      const box = $('workshops');
      const seen = new Set();
      const list = pickups.filter(p => {
        const k = (p.company+'|'+p.address).toLowerCase();
        if (!p.company || !p.address || seen.has(k)) return false;
        seen.add(k); return true;
      }).slice(0,12);
      box.innerHTML = list.length ? list.map(p => `<button class="workshop-chip" type="button" onclick="reuseWorkshop('${p.id}')">🏭 ${escapeHtml(p.company)}</button>`).join('') : '<span class="muted small">Warsztaty pojawią się tutaj po dodaniu odbiorów.</span>';
    }
    window.reuseWorkshop = function(id) {
      const p = pickups.find(x => x.id === id); if (!p) return;
      $('company').value=p.company||''; $('address').value=p.address||''; $('phone').value=p.phone||'';
      form.classList.remove('collapsed'); document.querySelector('.add-panel').scrollIntoView({behavior:'smooth'});
    };
    function wholeRouteUrl() {
      const day = activeDayDate();
      const list = pickups.filter(p => p.status !== 'done' && p.address && (!day || p.pickupDate === day)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
      if (!list.length) return '';
      if (list.length===1) return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(list[0].address);
      const routeList = list.slice(0, 10);
      const dest=routeList[routeList.length-1].address, wp=routeList.slice(0,-1).map(p=>p.address).join('|');
      return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+'&waypoints='+encodeURIComponent(wp)+'&travelmode=driving';
    }
    function setDriverMode(on) {
      document.body.classList.toggle('driver-mode', on);
      localStorage.setItem('driverMode', on?'1':'0');
      $('driverModeBtn').textContent = on ? '✕ WYJDŹ' : '🚚 DRIVER';
      if(on){ currentFilter='pending'; document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter==='pending')); }
      render();
    }


    function pendingOrdered() {
      const day = activeDayDate();
      return pickups
        .filter(p => p.status !== 'done' && (!day || p.pickupDate === day))
        .slice()
        .sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
    }

    function renderNextStop() {
      const box = $('nextStopCard');
      const list = pendingOrdered();
      if (!document.body.classList.contains('driver-mode') || !list.length) {
        box.classList.add('hidden');
        box.innerHTML = '';
        return;
      }
      const p = list[0];
      const tel = (p.phone || '').replace(/\s+/g,'');
      box.classList.remove('hidden');
      box.innerHTML = `
        <div class="next-stop-label">NASTĘPNY PUNKT</div>
        <div class="next-stop-main">
          <div>
            <h3>${escapeHtml(p.company || 'Odbiór')}</h3>
            <p>${escapeHtml(p.address || '')}</p>
            <strong>${p.time ? '🕒 ' + escapeHtml(p.time) : '🕒 Bez godziny'}</strong>
          </div>
        </div>
        <div class="next-stop-actions">
          <button class="action nav" type="button" onclick="navigatePickup('${p.id}')">🧭 Nawiguj</button>
          ${tel ? `<a class="action call" href="tel:${tel}">📞 Zadzwoń</a>` : ''}
          <button class="action complete" type="button" onclick="completePickup('${p.id}')">✅ Odebrane</button>
        </div>`;
    }

    window.navigatePickup = function(id) {
      const p = pickups.find(x=>x.id===id);
      if(!p || !p.address) return;
      window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.address), '_blank', 'noopener');
    };

    window.completePickup = function(id) {
      const p = pickups.find(x=>x.id===id);
      if(!p) return;
      p.status = 'done';
      save();
      render();
      showToast('Oznaczono jako odebrane.');
    };



    function getTimeValue() {
      const legacy = document.getElementById('time');
      if (legacy) return legacy.value || '';
      const h = document.getElementById('hour');
      const m = document.getElementById('minute');
      return (h && m && h.value && m.value) ? (h.value + ':' + m.value) : '';
    }

    function setTimeValue(value) {
      const legacy = document.getElementById('time');
      if (legacy) { legacy.value = value || ''; return; }
      const h = document.getElementById('hour');
      const m = document.getElementById('minute');
      if (!h || !m) return;
      if (value && value.includes(':')) {
        const parts = value.split(':');
        h.value = parts[0] || '';
        m.value = parts[1] || '';
      } else {
        h.value = '';
        m.value = '';
      }
    }

    function render() {
      updateStats();
      renderWorkshops();
      renderNextStop();
      const list = filteredPickups();
      if (!list.length) {
        const msg = currentFilter === 'done' ? 'Nie ma jeszcze zakończonych odbiorów.' : 'Brak zaplanowanych odbiorów. Dodaj pierwszy punkt trasy.';
        routeEl.innerHTML = `<div class="empty-state"><div class="empty-icon">🚚</div><strong>${msg}</strong><span>Twoja trasa pojawi się tutaj.</span></div>`;
        return;
      }

      routeEl.innerHTML = list.map((p, index) => {
        const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.address);
        const phoneHref = String(p.phone || '').replace(/[^+\d]/g, '');
        return `
          <article class="pickup-card ${p.status === 'done' ? 'done' : ''}">
            <div class="pickup-number">${p.status === 'done' ? '✓' : index + 1}</div>
            <div class="pickup-content">
              <div class="pickup-head">
                <div>
                  <span class="pickup-time">${escapeHtml(p.time || '--:--')}</span>
                  <h3>${escapeHtml(p.company)}</h3>
                  <span class="pickup-date">${escapeHtml(p.pickupDate || '')}</span>
                </div>
                <span class="status ${p.status}">${p.status === 'done' ? 'ZROBIONE' : 'DO ODBIORU'}</span>
              </div>
              <a class="address" href="${mapsUrl}" target="_blank" rel="noopener">📍 ${escapeHtml(p.address)}</a>
              ${(p.quantity || p.items) ? `<div class="pickup-detail">📦 ${p.quantity ? escapeHtml(p.quantity) + ' szt.' : ''}${p.quantity && p.items ? ' • ' : ''}${escapeHtml(p.items)}</div>` : ''}
              ${p.notes ? `<div class="pickup-note">📝 ${escapeHtml(p.notes)}</div>` : ''}
              <div class="pickup-actions">
                <a class="action nav" href="${mapsUrl}" target="_blank" rel="noopener">🧭 Nawiguj</a>
                ${p.phone ? `<a class="action" href="tel:${phoneHref}">📞 Zadzwoń</a>` : ''}
                <button class="action" type="button" onclick="editPickup('${p.id}')">✏️ Edytuj</button>
                <button class="action ${p.status === 'done' ? '' : 'complete'}" type="button" onclick="toggleDone('${p.id}')">${p.status === 'done' ? '↩ Cofnij' : '✓ Gotowe'}</button>
                <div class="move-buttons">
                  <button class="action move" type="button" onclick="movePickup('${p.id}', -1)" aria-label="Przesuń wyżej">↑</button>
                  <button class="action move" type="button" onclick="movePickup('${p.id}', 1)" aria-label="Przesuń niżej">↓</button>
                </div>
                <button class="action delete" type="button" onclick="deletePickup('${p.id}')">🗑 Usuń</button>
              </div>
            </div>
          </article>`;
      }).join('');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const company = $('company').value.trim();
      const address = $('address').value.trim();
      const time = $('time').value;
      const pickupDate = $('pickupDate').value || isoDate();
      if (!company || !address) return showToast('Uzupełnij firmę i adres.');

      const data = {
        company, address, time, pickupDate,
        phone: $('phone').value.trim(),
        quantity: $('quantity').value.trim(),
        items: $('items').value.trim(),
        notes: $('notes').value.trim()
      };
      const editingId = $('editingId').value;
      if (editingId) {
        pickups = pickups.map(p => p.id === editingId ? { ...p, ...data } : p);
        showToast('Zmiany zapisane.');
      } else {
        pickups.push(normalizePickup({ id: uid(), ...data }));
        showToast('Dodano odbiór do trasy.');
      }
      save();
      resetForm();
      render();
    });

    function resetForm() {
      form.reset();
      $('editingId').value = '';
      $('saveBtn').textContent = '＋ Dodaj do trasy';
      $('cancelEditBtn').classList.add('hidden');
      $('pickupDate').value = activeDayDate() || isoDate();
    }

    window.editPickup = function(id) {
      const p = pickups.find(x => x.id === id);
      if (!p) return;
      ['company','address','pickupDate','time','phone','quantity','items','notes'].forEach(key => $(key).value = p[key] ?? '');
      $('editingId').value = p.id;
      $('saveBtn').textContent = '💾 Zapisz zmiany';
      $('cancelEditBtn').classList.remove('hidden');
      form.classList.remove('collapsed');
      $('toggleForm').setAttribute('aria-expanded', 'true');
      $('toggleArrow').textContent = '⌃';
      document.querySelector('.add-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    window.toggleDone = function(id) {
      pickups = pickups.map(p => p.id === id ? {
        ...p,
        status: p.status === 'done' ? 'pending' : 'done',
        completedAt: p.status === 'done' ? null : Date.now()
      } : p);
      save(); render();
    };


    window.movePickup = function(id, direction) {
      const visible = filteredPickups();
      const idx = visible.findIndex(p => p.id === id);
      const other = visible[idx + direction];
      if (!other) return;
      const a = pickups.findIndex(p => p.id === id);
      const b = pickups.findIndex(p => p.id === other.id);
      if (a < 0 || b < 0) return;
      [pickups[a], pickups[b]] = [pickups[b], pickups[a]];
      save();
      render();
    };

    window.deletePickup = function(id) {
      const p = pickups.find(x => x.id === id);
      if (!p || !confirm(`Usunąć odbiór: ${p.company}?`)) return;
      pickups = pickups.filter(x => x.id !== id);
      save(); render(); showToast('Odbiór usunięty.');
    };

    $('cancelEditBtn').addEventListener('click', resetForm);

    document.querySelectorAll('.filter').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.filter').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    }));


    document.querySelectorAll('.day-filter').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.day-filter').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
      currentDay = btn.dataset.day;
      $('pickupDate').value = activeDayDate() || isoDate();
      render();
    }));

    $('toggleForm').addEventListener('click', () => {
      const collapsed = form.classList.toggle('collapsed');
      $('toggleForm').setAttribute('aria-expanded', String(!collapsed));
      $('toggleArrow').textContent = collapsed ? '⌄' : '⌃';
    });

    $('driverBtn').addEventListener('click', () => {
      const old = localStorage.getItem('driverName') || localStorage.getItem('driver') || '';
      const name = prompt('Podaj imię kierowcy:', old);
      if (name !== null) {
        localStorage.setItem('driverName', name.trim());
        $('pickupDate').value = isoDate();
    updateHeader();
      }
    });


    $('driverModeBtn').addEventListener('click', () => setDriverMode(!document.body.classList.contains('driver-mode')));
    $('openWholeRouteBtn').addEventListener('click', () => { const u=wholeRouteUrl(); if(!u) return showToast('Brak punktów do odbioru.'); window.open(u,'_blank','noopener'); });
    $('sortRouteBtn').addEventListener('click', () => { pickups.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')); save(); render(); showToast('Trasa ułożona według godziny.'); });



    function routeSummaryText() {
      const list = filteredPickups().filter(p => p.status !== 'done');
      if (!list.length) return 'Brak punktów do odbioru.';
      return ['Auto Body Manager – trasa', ...list.map((p,i) =>
        `${i+1}. ${p.time || '--:--'} – ${p.company} – ${p.address}${p.quantity ? ` – ${p.quantity} szt.` : ''}`
      )].join('\n');
    }

    $('shareRouteBtn').addEventListener('click', async () => {
      const text = routeSummaryText();
      try {
        if (navigator.share) await navigator.share({ title:'Trasa kierowcy', text });
        else {
          await navigator.clipboard.writeText(text);
          showToast('Trasa skopiowana do schowka.');
        }
      } catch (_) {}
    });

    function renderHistory() {
      const box = $('historyList');
      const list = pickups.filter(p => p.status === 'done').slice().sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
      box.innerHTML = list.length ? list.map((p,i)=>`
        <article class="pickup-card done">
          <div class="pickup-number">✓</div>
          <div class="pickup-content">
            <div class="pickup-head"><div><span class="pickup-time">${escapeHtml(p.time||'--:--')}</span><h3>${escapeHtml(p.company)}</h3><span class="pickup-date">${escapeHtml(p.pickupDate||'')}</span></div><span class="status done">ZROBIONE</span></div>
            <div class="address">📍 ${escapeHtml(p.address)}</div>
          </div>
        </article>`).join('') : '<div class="empty-state"><strong>Brak zakończonych odbiorów.</strong></div>';
    }

    $('historyBtn').addEventListener('click', () => {
      renderHistory();
      $('historyPanel').classList.toggle('hidden');
      if (!$('historyPanel').classList.contains('hidden')) $('historyPanel').scrollIntoView({behavior:'smooth'});
    });


    $('moreBtn').addEventListener('click', () => $('toolsPanel').classList.toggle('hidden'));

    $('clearBtn').addEventListener('click', () => {
      if (!pickups.length) return showToast('Trasa jest już pusta.');
      if (!confirm('Na pewno usunąć wszystkie punkty trasy?')) return;
      pickups = []; save(); render(); showToast('Trasa wyczyszczona.');
    });

    $('exportBtn').addEventListener('click', () => {
      const payload = JSON.stringify({ version: 6, exportedAt: new Date().toISOString(), pickups }, null, 2);
      const blob = new Blob([payload], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `auto-body-manager-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      showToast('Dane wyeksportowane.');
    });

    $('importInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        const incoming = Array.isArray(parsed) ? parsed : parsed.pickups;
        if (!Array.isArray(incoming)) throw new Error('bad format');
        pickups = incoming.map(normalizePickup);
        save(); render(); showToast('Dane zaimportowane.');
      } catch (_) {
        alert('Nie udało się wczytać pliku. Wybierz eksport z Auto Body Manager.');
      }
      e.target.value = '';
    });

    $('pickupDate').value = isoDate();
    updateHeader();
    if(localStorage.getItem('driverMode')==='1') setDriverMode(true); else render();
  </script>
</body>
</html>
