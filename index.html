<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>🚚 Auto Body Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:white;padding:16px} .top,main{max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:22px;margin:0}.role,button,input,select,textarea{font:inherit}.role{padding:11px;border:0;border-radius:10px;background:#374151;color:white}
main{padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:white;border-radius:15px;padding:17px;margin-bottom:12px;box-shadow:0 1px 5px #0001}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
button{border:0;border-radius:10px;padding:11px 15px}.primary{background:#2563eb;color:white}.success{background:#16a34a;color:white}.danger{background:#dc2626;color:white}.secondary{background:#e5e7eb}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{padding:5px 9px;border-radius:999px;font-size:13px;font-weight:700;background:#fef3c7}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.blue{background:#dbeafe;color:#1e40af}
.muted{color:#6b7280}.stat{font-size:30px;font-weight:800}label{display:block;font-weight:600;margin:10px 0 5px}
input,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px}textarea{min-height:80px}.hidden{display:none!important}
nav{display:flex;gap:8px;overflow:auto;margin-bottom:15px}nav button{white-space:nowrap}.route{border-left:5px solid #2563eb}.route.done{border-left-color:#16a34a}.route.problem{border-left-color:#dc2626}
.notice{padding:12px;background:#eff6ff;border-radius:10px;color:#1e3a8a;margin-bottom:14px}
</style>
</head>
<body>
<header><div class="top"><h1>🚚 Auto Body Manager</h1>
<select id="role" class="role"><option value="driver">Kierowca</option><option value="manager">Kierownik</option></select></div></header>
<main>
<div class="notice">Auto Body Manager V2 — trasy, odbiory, status „Odebrane”, problemy i nawigacja.</div>

<section id="driverView">
<nav><button class="primary" onclick="driverTab('routes')">🚚 Trasy</button><button class="secondary" onclick="driverTab('problem')">⚠️ Problem</button></nav>
<div id="driverRoutes"></div>
<div id="driverProblem" class="card hidden"><h2>⚠️ Zgłoś problem</h2>
<label>Warsztat</label><input id="problemGarage" placeholder="Nazwa warsztatu">
<label>Opis</label><textarea id="problemText" placeholder="Opisz problem..."></textarea>
<div class="actions"><button class="danger" onclick="reportProblem()">Wyślij zgłoszenie</button></div></div>
</section>

<section id="managerView" class="hidden">
<nav><button class="primary" onclick="managerTab('dashboard')">📊 Panel</button><button class="secondary" onclick="managerTab('routes')">🗺️ Trasy</button><button class="secondary" onclick="managerTab('add')">➕ Dodaj trasę</button></nav>
<div id="managerDashboard"></div><div id="managerRoutes" class="hidden"></div>
<div id="managerAdd" class="card hidden"><h2>➕ Dodaj trasę</h2>
<label>Warsztat</label><input id="garage"><label>Adres / postcode</label><input id="address">
<label>Kierowca</label><input id="driver"><label>Data</label><input id="date" type="date">
<label>Uwagi</label><textarea id="notes"></textarea><div class="actions"><button class="success" onclick="addRoute()">Dodaj trasę</button></div></div>
</section>
</main>
<script>
const KEY="auto_body_manager_v2";
let routes=JSON.parse(localStorage.getItem(KEY)||"null")||[];
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(routes))}
function badge(s){let c=s==="Odebrane"?"green":s==="Problem"?"red":s==="W trasie"?"blue":"";return `<span class="badge ${c}">${esc(s)}</span>`}
function map(a){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a)}
function render(){let manager=$("role").value==="manager";$("driverView").classList.toggle("hidden",manager);$("managerView").classList.toggle("hidden",!manager);manager?renderManager():renderDriver()}
function renderDriver(){$("driverRoutes").innerHTML=routes.length?routes.map(r=>`<div class="card route ${r.status==="Odebrane"?"done":r.status==="Problem"?"problem":""}"><div class="row"><h2>${esc(r.garage)}</h2>${badge(r.status)}</div><div class="muted">📍 ${esc(r.address)} · 📅 ${esc(r.date)}</div><p>${esc(r.notes)}</p>${r.problem?`<div class="notice">⚠️ ${esc(r.problem)}</div>`:""}<div class="actions"><a href="${map(r.address)}" target="_blank"><button class="secondary">🧭 Nawigacja</button></a>${r.status!=="Odebrane"?`<button class="success" onclick="status(${r.id},'Odebrane')">✅ Odebrane</button>`:""}<button class="danger" onclick="problem(${r.id})">⚠️ Problem</button></div></div>`).join(""):'<div class="card">Brak przydzielonych tras.</div>'}
function renderManager(){let done=routes.filter(r=>r.status==="Odebrane").length,pro=routes.filter(r=>r.status==="Problem").length;$("managerDashboard").innerHTML=`<div class="grid"><div class="card"><div class="muted">Wszystkie trasy</div><div class="stat">${routes.length}</div></div><div class="card"><div class="muted">Odebrane</div><div class="stat">${done}</div></div><div class="card"><div class="muted">Problemy</div><div class="stat">${pro}</div></div></div>`;$("managerRoutes").innerHTML=routes.map(r=>`<div class="card route"><div class="row"><h2>${esc(r.garage)}</h2>${badge(r.status)}</div><div class="muted">📍 ${esc(r.address)} · 👤 ${esc(r.driver)} · 📅 ${esc(r.date)}</div><p>${esc(r.notes)}</p>${r.problem?`<div class="notice">⚠️ ${esc(r.problem)}</div>`:""}<div class="actions"><a href="${map(r.address)}" target="_blank"><button class="secondary">🧭 Mapa</button></a><button class="success" onclick="status(${r.id},'Odebrane')">✅ Odebrane</button><button class="danger" onclick="status(${r.id},'Problem')">⚠️ Problem</button><button class="secondary" onclick="del(${r.id})">Usuń</button></div></div>`).join("")||'<div class="card">Brak tras.</div>'}
function status(id,s){let r=routes.find(x=>x.id===id);if(r){r.status=s;save();render()}}
function problem(id){let r=routes.find(x=>x.id===id),p=prompt("Opisz problem:");if(r&&p){r.status="Problem";r.problem=p;save();render()}}
function reportProblem(){let g=$("problemGarage").value.trim(),p=$("problemText").value.trim();if(!g||!p)return alert("Uzupełnij pola.");routes.push({id:Date.now(),garage:g,address:"",driver:"Kierowca",date:new Date().toISOString().slice(0,10),status:"Problem",notes:"Zgłoszenie kierowcy",problem:p});save();$("problemGarage").value="";$("problemText").value="";alert("Problem zgłoszony.");driverTab("routes");render()}
function addRoute(){let g=$("garage").value.trim(),a=$("address").value.trim(),d=$("driver").value.trim(),date=$("date").value,n=$("notes").value.trim();if(!g||!a||!d||!date)return alert("Uzupełnij warsztat, adres, kierowcę i datę.");routes.push({id:Date.now(),garage:g,address:a,driver:d,date,status:"Nowe",notes:n,problem:""});save();managerTab("routes");render()}
function del(id){if(confirm("Usunąć trasę?")){routes=routes.filter(r=>r.id!==id);save();render()}}
function driverTab(t){$("driverRoutes").classList.toggle("hidden",t!=="routes");$("driverProblem").classList.toggle("hidden",t!=="problem")}
function managerTab(t){$("managerDashboard").classList.toggle("hidden",t!=="dashboard");$("managerRoutes").classList.toggle("hidden",t!=="routes");$("managerAdd").classList.toggle("hidden",t!=="add")}
$("role").onchange=render;render();
</script>
</body></html>
